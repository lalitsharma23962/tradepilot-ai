name: v38 sensitivity audit
on:
  push:
    branches: [diagnostic/v38-funnel-1h-4h]
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/run-v38-sensitivity.ts
